name: Build song sheets

# Regenerate every song's sheet.html and the dashboard from song.json + the
# .txt sources on each push to main, and commit any changes back. This is a
# safety net: if you edit a song.json or a suno-*.txt and forget to run
# `node tools/build_sheets.mjs` locally, CI does it for you and GitHub Pages
# redeploys the fresh output.
#
# The commit is pushed with the default GITHUB_TOKEN, which by design does NOT
# trigger another workflow run — so there is no loop.

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: build-sheets-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Generate sheets + dashboard
        run: node tools/build_sheets.mjs

      - name: Rebuild the illustration picker (word lists change with vocab)
        run: node tools/illustrations/build_picker.mjs

      - name: Commit regenerated output (only if something changed)
        run: |
          if [[ -n "$(git status --porcelain)" ]]; then
            git config user.name  "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "chore: regenerate song sheets + dashboard [skip ci]"
            git push
            echo "Regenerated and pushed."
          else
            echo "Sheets already up to date — nothing to commit."
          fi
